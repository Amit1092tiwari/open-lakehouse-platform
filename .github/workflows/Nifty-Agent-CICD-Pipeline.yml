# 1. SCHEDULED (Automatic)
schedule:
  - cron: '*/5 3-10 * * 1-5'  # Every 5 min during market hours

# 2. ON PUSH
on:
  push:
    branches: [main, master, develop]
    paths: ['agents/**']

# 3. PULL REQUEST
on:
  pull_request:
    branches: [main, master]

# 4. MANUAL DISPATCH
workflow_dispatch:
  inputs:
    run_mode: [test, once, continuous]
    frequency: [every_min, every_5_min, hourly, daily]