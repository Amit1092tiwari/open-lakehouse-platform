name: Open Lakehouse Platform CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  DOTNET_VERSION: "8.0.x"

jobs:
  lint:
    name: "🔍 Lint & Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install flake8 black isort

      - name: Run code formatting & style checks
        run: |
          black --check --line-length=120 storage/ ai_vector_pipeline/ apps/ tests/ warehouse/ || true
          flake8 --max-line-length=120 --ignore=E501,W503,E203 storage/ warehouse/ tests/ || true

  unit-tests:
    name: "🧪 Unit & Regression Tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pyyaml pandas requests

      - name: Execute Pytest Suite
        run: |
          python -m pytest tests/ -v --tb=short

  dotnet-api-check:
    name: "🔷 .NET 8 Backend API Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore sample_dotnet_backend/src/DataPipelineApi/DataPipelineApi.csproj

      - name: Build API in Release mode
        run: dotnet build --no-restore --configuration Release sample_dotnet_backend/src/DataPipelineApi/DataPipelineApi.csproj

  docker-compose-validation:
    name: "📋 Docker Compose Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment file
        run: cp .env.example .env

      - name: Validate Compose Stack Definitions
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.lite.yaml config --quiet
          docker compose -f docker-compose.ci.yaml config --quiet
          echo "All Docker Compose configurations validated."

  e2e-live-pipeline-execution:
    name: "🚀 Live End-to-End Pipeline Execution"
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-compose-validation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install E2E runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pymysql boto3 redis kafka-python requests pandas

      - name: Start Live CI Infrastructure
        run: |
          docker compose -f docker-compose.ci.yaml up -d
          echo "Services started. Waiting for database and storage readiness..."

      - name: Wait for Service Health Probes
        run: |
          for i in {1..30}; do
            POSTGRES_READY=0
            MYSQL_READY=0
            docker compose -f docker-compose.ci.yaml exec -T postgres pg_isready -U test_user -d processed_db 2>/dev/null && POSTGRES_READY=1 || true
            docker compose -f docker-compose.ci.yaml exec -T mysql mysqladmin ping -h localhost -u root -ptest_root 2>/dev/null && MYSQL_READY=1 || true
            if [ "$POSTGRES_READY" -eq 1 ] && [ "$MYSQL_READY" -eq 1 ]; then
              echo "PostgreSQL & MySQL services are healthy and accepting connections!"
              break
            fi
            echo "Waiting for services (Attempt $i/30)..."
            sleep 2
          done

      - name: Execute End-to-End Live Pipeline Runner
        run: |
          python scripts/run_e2e_pipeline.py

      - name: Execute Daily Unique Test Scenarios Validation
        run: |
          python scripts/run_daily_test_scenarios.py

      - name: Publish Test Report & Findings to GitHub Step Summary
        if: always()
        run: |
          cat reports/daily_test_scenario_validation_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Daily Test Scenario & Findings Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-scenario-validation-report
          path: reports/daily_test_scenario_validation_report.md

      - name: Teardown CI Infrastructure
        if: always()
        run: |
          docker compose -f docker-compose.ci.yaml down -v

  docker-image-builds:
    name: "🐳 Container Image Builds"
    runs-on: ubuntu-latest
    needs: [docker-compose-validation]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kafka-producer
            dockerfile: kafka/Dockerfile
            context: kafka
          - service: dotnet-api
            dockerfile: sample_dotnet_backend/Dockerfile
            context: sample_dotnet_backend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image (${{ matrix.service }})
        run: |
          docker build -t pipeline-${{ matrix.service }}:ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}

  pipeline-complete:
    name: "✅ CI/CD Gate Complete"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, dotnet-api-check, docker-compose-validation, e2e-live-pipeline-execution, docker-image-builds]
    if: always()
    steps:
      - name: Check overall results
        run: |
          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.dotnet-api-check.result }}" = "failure" ] || \
             [ "${{ needs.docker-compose-validation.result }}" = "failure" ] || \
             [ "${{ needs.e2e-live-pipeline-execution.result }}" = "failure" ] || \
             [ "${{ needs.docker-image-builds.result }}" = "failure" ]; then
            echo "CI/CD Pipeline failed. Check individual job logs."
            exit 1
          fi
          echo "All pipeline quality gates passed end-to-end successfully!"
